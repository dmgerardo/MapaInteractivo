<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa Interactivo</title>
  <link rel="icon" href="iconos/favicon.svg?v=6" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="iconos/icono-180.png?v=6" />
  <link rel="mask-icon" href="iconos/mask-icon.svg?v=6" color="#4fc3f7" />
  <link rel="manifest" href="site.webmanifest?v=6" />
  <meta name="theme-color" content="#000814" />
  <link rel="stylesheet" href="css/estilos.css?v=6" />
</head>
<body>
  <header id="encabezado">
    <h1>
      <span id="marca-app" aria-hidden="true"></span>
      Mapa Interactivo
      <button id="boton-version" type="button" title="Recargar la página"></button>
    </h1>
    <a id="enlace-mantenimiento" href="mantenimiento.html" aria-label="Mantenimiento" title="Mantenimiento"></a>
  </header>

  <main id="contenedor-globo"></main>

  <aside id="panel-info" class="oculto" aria-live="polite">
    <button id="cerrar-panel-info" type="button" aria-label="Cerrar" title="Cerrar"></button>
    <div id="panel-info-contenido"></div>
  </aside>

  <div id="menu-capas">
    <button id="boton-menu-capas" type="button" aria-label="Capas" title="Capas" aria-expanded="false"></button>
    <div id="lista-capas" class="oculto"></div>
  </div>

  <div id="menu-vista">
    <button id="boton-menu-vista" type="button" aria-label="Vista del mapa" title="Vista del mapa" aria-expanded="false"></button>
    <div id="lista-vistas" class="oculto"></div>
  </div>

  <div id="menu-giro">
    <button id="boton-giro" type="button" aria-label="Girar automáticamente" title="Girar automáticamente" aria-expanded="false"></button>
    <div id="panel-giro" class="oculto">
      <label for="control-velocidad-giro">Velocidad</label>
      <input id="control-velocidad-giro" type="range" min="0.5" max="8" step="0.5" value="2" />
    </div>
  </div>

  <button id="boton-reporte" type="button" aria-label="Reporte" title="Reporte" aria-expanded="false"></button>

  <aside id="panel-reporte" class="oculto" aria-live="polite">
    <button id="cerrar-panel-reporte" type="button" aria-label="Cerrar" title="Cerrar"></button>
    <h2>En vista</h2>
    <div id="lista-reporte"></div>
  </aside>

  <!-- globe.gl: versión vanilla (sin React) de la misma librería de vasturiano/react-globe.gl -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>

  <!-- main.js importa db.js (que a su vez importa firebase-config.js), utilidades.js e iconos.js -->
  <script type="module" src="js/main.js?v=6"></script>
</body>
</html>
